# FYP configuration: every tunable parameter lives here (FYP_PLAN.md Section 0).

data:
  start: "2010-01-01"
  end: "2026-08-31"            # last complete month (plan Section 3); inclusive
  raw_dir: data/raw
  processed_dir: data/processed
  benchmark: SPY
  risk_free: "^IRX"            # 13-week T-bill yield, annualized percent
  trading_days_per_year: 252
  # Cleaning rules
  max_ffill_days: 5            # longest gap (trading days) filled with the last known price
  max_missing_frac: 0.01       # a ticker with more missing days than this is rejected
  extreme_daily_return: 0.40   # |daily return| above this is logged for manual review

backtest:
  oos_start: "2016-01-01"      # first out-of-sample month; earlier data only for training
  cov_window_days: 252         # trailing window for the covariance (Section 6.4)
  cost_bps: 10                 # per unit turnover (Section 6.5)
  cost_bps_grid: [0, 10, 25]
  w_max: 0.10                  # per-stock weight cap (Section 6.6)
  execution_lag_robust: 1      # robustness: trade 1 trading day after the decision

estimators:
  mean_window_months: null     # historical mean μ: null = expanding window

optimization:
  solver: CLARABEL             # cvxpy interior-point QP solver
  sector_max: 0.25             # A4: no sector above 25% of the portfolio, none excluded; applies to
                               # every optimized strategy (S3–S6) and to the tool. null = no sector rule
  kkt_tol: 1.0e-6              # tolerance when checking KKT conditions (T4)
  weight_tol: 1.0e-5           # a weight this close to a bound counts as at the bound

frontier_plot:                 # Phase 1 figures
  as_of: "2026-08-31"          # estimation date for μ and Σ
  n_points: 60
  figure_dir: report/figures
  x_max_vol_pa: 40               # x-axis limit of frontier.png (% per year)
  y_headroom_pa: 6               # space above the highest frontier point (% per year)

phase2:                        # baseline backtest outputs (S1-S4)
  main_gamma: medium           # risk level used for the headline S4 (all levels are run)
  sharpe_ci_level: 0.95
  sharpe_test_block: 6          # months per bootstrap block (≈ T^(1/3) for T = 128)
  sharpe_test_boot: 10000       # bootstrap samples for Sharpe-difference tests
  sharpe_test_block_robust: [3, 12]   # alternative block lengths reported as a check
  figure_dir: report/figures
  table_dir: report/tables

ml:                            # Phase 3 forecasting (plan Section 4)
  windows:                     # trading-day windows for daily features
    m1: 21
    m3: 63
    y1: 252
  rsi_days: 14
  retrain_every_months: 12     # elastic net is re-tuned and refit once a year
  val_months: 24               # validation = last 24 feature months of each training window
  min_train_months: 24         # fewer than this before validation -> no forecast
  elastic_net:
    alphas: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2]
    l1_ratios: [0.1, 0.5, 0.9, 1.0]   # 1.0 = lasso; small values approach ridge
    max_iter: 50000
  lightgbm:
    num_leaves: [7, 15]
    min_child_samples: [100, 300]
    learning_rate: 0.02
    max_trees: 2000            # upper bound; early stopping on the validation months
    early_stopping_rounds: 100
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
  mlp:
    hidden_layers: [[32, 16], [32, 16, 8]]   # 2 or 3 hidden layers (plan 4.2)
    alphas: [1.0e-4, 1.0e-2]                 # L2 penalty
    learning_rate_init: 1.0e-3
    batch_size: 256
    max_epochs: 200            # early stopping on the validation months (not a random split)
    patience: 20
  ensemble:
    n_copies: 10               # Ω-B: copies trained on bootstrap samples of months
  quantiles: 5                 # quintile spread (51 stocks: ~10 per group)
  permutation_repeats: 20

phase3:
  table_dir: report/tables
  figure_dir: report/figures
  forecast_dir: data/ml           # forecasts + Ω-B variances for Phase 4 (git-ignored)
  main_gamma: medium

risk_tolerance:                # γ for each level (Section 2.6)
  low: 10
  medium: 5
  high: 2

black_litterman:                # Phase 4 (plan Section 2.4, 4.4)
  delta: 2.5                   # market risk aversion in the prior Π = δ Σ w_mkt
  tau: 0.05
  tau_grid: [0.01, 0.025, 0.05, 0.1, 0.25]
  omega_a_window: 24           # Ω-A: mean squared forecast error over the last 24 realized months
  omega_a_prior_months: 12     # warm-up: shrink toward the stock's return variance with 12 pseudo-months
  omega_scale_grid: [0.25, 1.0, 4.0]   # ablation: Ω multiplied by these factors
  # Headline S6, fixed before any Phase 4 result was computed (D4.1); all else = ablations.
  headline:
    model: Elastic net
    omega: A
    gamma: medium

phase4:
  table_dir: report/tables
  figure_dir: report/figures

final_design:                  # D6 (23 Oct 2026): chosen after the experiment branch; see DECISIONS D6
  view_models: [elastic_net, lightgbm]   # Phase 3 forecasts, averaged into one view set
  risk_model: true             # Σ = D·R·D with elastic-net volatility forecasts (src.risk_model)
  omega: A
  gamma: medium
  subperiod_end: "2021-12-31"  # results also reported for 2016–2021 and 2022–2026
  table_dir: report/tables

recommend:                     # Phase 5 tool (plan Section 2.6)
  as_of: null                  # null = last month-end in the data
  # Worked examples for the report (reproducible: same data + config -> same output).
  # The user gives only an amount and a risk tolerance (A4); A is the walkthrough example.
  examples:
    - name: "A: $10,000, medium risk"
      amount: 10000
      risk: medium
    - name: "B: $10,000, low risk"
      amount: 10000
      risk: low
    - name: "C: $10,000, high risk"
      amount: 10000
      risk: high
    - name: "D: $250,000, medium risk"
      amount: 250000
      risk: medium
    - name: "E: $2,000, medium risk"
      amount: 2000
      risk: medium
  walkthrough: "A: $10,000, medium risk"

phase5:
  table_dir: report/tables
  figure_dir: report/figures

tail_risk:
  alpha: 0.95

seed: 42

