# FYP configuration: every tunable parameter lives here (FYP_PLAN.md Section 0).

data:
  start: "2010-01-01"
  end: "2026-08-31"            # last complete month (plan Section 3); inclusive
  raw_dir: data/raw
  processed_dir: data/processed
  benchmark: SPY
  risk_free: "^IRX"            # 13-week T-bill yield, annualized percent
  trading_days_per_year: 252
  # Cleaning rules
  max_ffill_days: 5            # longest gap (trading days) filled with the last known price
  max_missing_frac: 0.01       # a ticker with more missing days than this is rejected
  extreme_daily_return: 0.40   # |daily return| above this is logged for manual review

backtest:
  oos_start: "2016-01-01"      # first out-of-sample month; earlier data only for training
  cov_window_days: 252         # trailing window for the covariance (Section 6.4)
  cost_bps: 10                 # per unit turnover (Section 6.5)
  cost_bps_grid: [0, 10, 25]
  w_max: 0.10                  # per-stock weight cap (Section 6.6)
  execution_lag_robust: 1      # robustness: trade 1 trading day after the decision

estimators:
  mean_window_months: null     # historical mean μ: null = expanding window

optimization:
  solver: CLARABEL             # cvxpy interior-point QP solver
  sector_bounds: {}            # default: none. e.g. {Energy: [0.0, 0.0]} excludes energy
  kkt_tol: 1.0e-6              # tolerance when checking KKT conditions (T4)
  weight_tol: 1.0e-5           # a weight this close to a bound counts as at the bound

frontier_plot:                 # Phase 1 figures
  as_of: "2026-08-31"          # estimation date for μ and Σ
  n_points: 60
  figure_dir: report/figures
  x_max_vol_pa: 40               # x-axis limit of frontier.png (% per year)
  y_headroom_pa: 6               # space above the highest frontier point (% per year)

phase2:                        # baseline backtest outputs (S1-S4)
  main_gamma: medium           # risk level used for the headline S4 (all levels are run)
  sharpe_ci_level: 0.95
  sharpe_test_block: 6          # months per bootstrap block (≈ T^(1/3) for T = 128)
  sharpe_test_boot: 10000       # bootstrap samples for Sharpe-difference tests
  sharpe_test_block_robust: [3, 12]   # alternative block lengths reported as a check
  figure_dir: report/figures
  table_dir: report/tables

ml:                            # Phase 3 forecasting (plan Section 4)
  windows:                     # trading-day windows for daily features
    w1: 5                      # extended set only (model search)
    m1: 21
    m3: 63
    y1: 252
  rsi_days: 14
  retrain_every_months: 12     # elastic net is re-tuned and refit once a year
  val_months: 24               # validation = last 24 feature months of each training window
  min_train_months: 24         # fewer than this before validation -> no forecast
  elastic_net:
    alphas: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2]
    l1_ratios: [0.1, 0.5, 0.9, 1.0]   # 1.0 = lasso; small values approach ridge
    max_iter: 50000
  lightgbm:
    num_leaves: [7, 15]
    min_child_samples: [100, 300]
    learning_rate: 0.02
    max_trees: 2000            # upper bound; early stopping on the validation months
    early_stopping_rounds: 100
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
  mlp:
    hidden_layers: [[32, 16], [32, 16, 8]]   # 2 or 3 hidden layers (plan 4.2)
    alphas: [1.0e-4, 1.0e-2]                 # L2 penalty
    learning_rate_init: 1.0e-3
    batch_size: 256
    max_epochs: 200            # early stopping on the validation months (not a random split)
    patience: 20
  ensemble:
    n_copies: 10               # Ω-B: copies trained on bootstrap samples of months
  quantiles: 5                 # quintile spread (51 stocks: ~10 per group)
  permutation_repeats: 20

model_search:                  # MS1–MS3 in DECISIONS.md (fixed before running)
  dev_end: "2021-12-31"        # setups compared only on forecasts made up to here
  families: [Elastic net, LightGBM, MLP, Random forest, Huber, Extra trees, KNN,
             PCA regression, Hist gradient boosting, Kernel ridge,
             Logistic classifier, LightGBM classifier, Linear SVR,
             Quantile regression, Naive Bayes classifier]
  combine: true                # also an equal-weight average of all families (MS6)
  train_windows: [null, 96, 72, 60, 48]    # months; null = expanding
  targets: [raw, demeaned]
  feature_sets: [base, extended, niche]
  n_finalists: 3
  dev_blocks: ["2017-11-30", "2019-11-30"]   # cut points: 3 development blocks (MS5)
  random_forest:
    n_estimators: 300
    max_depth: [4, 8]
    min_samples_leaf: [50, 200]
    max_features: 0.5
  huber:                       # robust linear regression (down-weights extreme months)
    epsilon: [1.35, 2.0]
    alpha: [1.0e-4, 1.0e-2]
  extra_trees:                 # like a random forest but with random split points
    n_estimators: 300
    max_depth: [4, 8]
    min_samples_leaf: [50, 200]
    max_features: 0.5
  knn:                         # average of the most similar past stock-months
    n_neighbors: [50, 200, 500]
  pca_regression:              # PCA on the signals, then ridge on the first components
    n_components: [3, 6]
    alpha: [1.0, 100.0]
  hist_gradient_boosting:
    max_depth: [2, 4]
    learning_rate: [0.02, 0.1]
    max_iter: 200
    min_samples_leaf: 100
  kernel_ridge:                # RBF kernel, Nystroem approximation
    gamma: [0.1, 1.0]
    alpha: [1.0, 100.0]
    n_components: 300
  logistic_classifier:         # beats the month's median? (MS7)
    C: [0.01, 1.0]
  lightgbm_classifier:
    num_leaves: [7, 15]
    n_estimators: [50, 200]
  linear_svr:
    C: [0.01, 1.0]
  quantile_regression:         # median regression (MS9)
    alpha: [0.0, 0.001]
  placebo:                     # MS7: same search on targets shuffled within each month
    seed: 7
    families: [Elastic net, Huber, PCA regression, LightGBM, KNN, Hist gradient boosting,
               Kernel ridge, Logistic classifier, Linear SVR]
  round4:                      # MS8: deeper settings for families that ever passed
    families: [KNN, MLP, LightGBM, Hist gradient boosting, Kernel ridge]
    feature_sets: [base, niche, risk]
    retrain_every: [12, 6]
    risk_set: [beta_1y, downside_beta_1y, vol_1m, vol_3m, idio_vol_3m, range_vol_1m,
               max_dd_1y, dist_52w, sector_rev_1m, overnight_1m]
    wide:
      KNN: {n_neighbors: [20, 50, 100, 200, 500, 1000], weights: [uniform, distance]}
      MLP: {hidden_layers: [[16], [32, 16], [64, 32], [64, 32, 16], [128, 64, 32, 16],
                           [64, 64, 64, 64]], alphas: [1.0e-5, 1.0e-3, 1.0e-1]}
      LightGBM: {num_leaves: [3, 7, 15, 31], min_child_samples: [50, 150, 400]}
      Hist gradient boosting: {max_depth: [2, 3, 5], learning_rate: [0.01, 0.05, 0.1],
                               min_samples_leaf: [50, 200]}
      Kernel ridge: {gamma: [0.03, 0.1, 0.3, 1.0, 3.0], alpha: [0.1, 1.0, 10.0, 100.0]}
  wide:                        # WU1: ~1,050-stock universe (forecasting test)
    windows: [null]
    targets: [raw, demeaned]
    feature_sets: [base, niche]
    overrides:                 # lighter settings for 30x more rows
      random_forest: {n_estimators: 100, max_samples: 0.3}
      extra_trees: {n_estimators: 100, max_samples: 0.3}
      knn: {n_neighbors: [200, 1000]}
      quantile_regression: {alpha: [0.0], max_rows: 25000}
    out_dir: data/ml/search_wide
    portfolio:                 # WU4
      w_max: 0.02
      cov_method: ledoit_wolf
  out_dir: data/ml/search      # forecasts of every setup (git-ignored)

phase3:
  table_dir: report/tables
  figure_dir: report/figures
  forecast_dir: data/ml           # forecasts + Ω-B variances for Phase 4 (git-ignored)
  main_gamma: medium

risk_tolerance:                # γ for each level (Section 2.6)
  low: 10
  medium: 5
  high: 2

black_litterman:                # Phase 4 (plan Section 2.4, 4.4)
  delta: 2.5                   # market risk aversion in the prior Π = δ Σ w_mkt
  tau: 0.05
  tau_grid: [0.01, 0.025, 0.05, 0.1, 0.25]
  omega_a_window: 24           # Ω-A: mean squared forecast error over the last 24 realized months
  omega_a_prior_months: 12     # warm-up: shrink toward the stock's return variance with 12 pseudo-months
  omega_scale_grid: [0.25, 1.0, 4.0]   # ablation: Ω multiplied by these factors
  # Headline S6, fixed before any Phase 4 result was computed (D4.1); all else = ablations.
  headline:
    model: Elastic net
    omega: A
    gamma: medium

phase4:
  table_dir: report/tables
  figure_dir: report/figures

recommend:                     # Phase 5 tool (plan Section 2.6)
  as_of: null                  # null = last month-end in the data
  # Worked examples for the report (reproducible: same data + config -> same output).
  examples:
    - name: "A: $10,000, medium risk, no preferences"
      amount: 10000
      risk: medium
    - name: "B: $10,000, medium risk, no Energy, IT at most 20%"
      amount: 10000
      risk: medium
      exclude: [Energy]
      max_sector: {Information Technology: 0.20}
    - name: "C: $10,000, low risk, same preferences as B"
      amount: 10000
      risk: low
      exclude: [Energy]
      max_sector: {Information Technology: 0.20}
    - name: "D: $10,000, high risk, same preferences as B"
      amount: 10000
      risk: high
      exclude: [Energy]
      max_sector: {Information Technology: 0.20}
    - name: "E: $250,000, medium risk, same preferences as B"
      amount: 250000
      risk: medium
      exclude: [Energy]
      max_sector: {Information Technology: 0.20}
    - name: "F: $10,000, medium risk, at least 15% Health Care"
      amount: 10000
      risk: medium
      min_sector: {Health Care: 0.15}

phase5:
  table_dir: report/tables
  figure_dir: report/figures

tail_risk:
  alpha: 0.95

seed: 42

